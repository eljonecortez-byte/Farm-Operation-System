<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Tropical Coconut Plantation Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="60%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>

    <linearGradient id="coconutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="70%" stop-color="#4d7c0f" />
      <stop offset="100%" stop-color="#3f6212" />
    </linearGradient>

    <linearGradient id="matureNutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#022c22" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background App Icon Tile -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#skyGrad)" filter="url(#softShadow)" />

  <!-- Tropical Sun & Rings -->
  <circle cx="370" cy="140" r="64" fill="url(#sunGrad)" opacity="0.9" filter="url(#glow)" />
  <circle cx="370" cy="140" r="88" fill="#fef08a" opacity="0.15" />

  <!-- Farm Mound Landscape -->
  <path d="M 24 430 Q 180 370 320 400 T 488 420 L 488 488 L 24 488 Z" fill="#15803d" opacity="0.7" />
  <path d="M 24 450 Q 140 410 270 430 T 488 440 L 488 488 L 24 488 Z" fill="#0f5132" />

  <!-- Coconut Palm Trunk -->
  <path d="M 230 450 Q 240 330 220 220 Q 215 190 225 170 C 235 170 245 190 250 220 Q 275 330 270 450 Z" fill="url(#trunkGrad)" />
  <!-- Trunk Ring Texture -->
  <path d="M 233 410 Q 252 405 268 410" stroke="#b45309" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M 231 370 Q 250 365 266 370" stroke="#b45309" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M 228 330 Q 246 325 262 330" stroke="#b45309" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M 224 290 Q 240 285 256 290" stroke="#b45309" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M 221 250 Q 235 245 250 250" stroke="#b45309" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M 220 210 Q 230 205 244 210" stroke="#b45309" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7" />

  <!-- Coconut Fruits Cluster -->
  <!-- Green coconuts -->
  <circle cx="218" cy="184" r="17" fill="url(#coconutGrad)" />
  <circle cx="242" cy="180" r="18" fill="url(#coconutGrad)" />
  <!-- Brown mature coconuts -->
  <circle cx="228" cy="195" r="16" fill="url(#matureNutGrad)" />
  <circle cx="248" cy="196" r="15" fill="url(#matureNutGrad)" />

  <!-- Coconut Palm Leaves / Fronds -->
  <!-- Left Arching Leaves -->
  <path d="M 230 170 C 190 150 120 160 80 230 C 120 205 180 185 230 170 Z" fill="url(#leafGrad1)" />
  <path d="M 230 170 C 170 120 110 100 60 140 C 100 130 160 140 230 170 Z" fill="url(#leafGrad2)" />
  <path d="M 230 170 C 200 90 140 60 90 80 C 130 90 180 120 230 170 Z" fill="url(#leafGrad1)" />

  <!-- Top / Upward Leaves -->
  <path d="M 230 170 C 220 70 240 40 270 50 C 265 90 250 130 230 170 Z" fill="url(#leafGrad2)" />

  <!-- Right Arching Leaves -->
  <path d="M 235 170 C 280 80 340 70 380 100 C 340 115 290 135 235 170 Z" fill="url(#leafGrad1)" />
  <path d="M 235 170 C 310 120 370 140 420 190 C 370 175 300 165 235 170 Z" fill="url(#leafGrad2)" />
  <path d="M 235 170 C 300 165 370 205 400 270 C 360 230 290 200 235 170 Z" fill="url(#leafGrad1)" />

  <!-- KPI Growth Badge / Pin on Bottom Right -->
  <g transform="translate(320, 320)">
    <circle cx="60" cy="60" r="54" fill="#ffffff" filter="url(#softShadow)" />
    <circle cx="60" cy="60" r="46" fill="#15803d" />
    <!-- KPI upward graph bar & arrow -->
    <rect x="36" y="70" width="8" height="20" rx="3" fill="#86efac" />
    <rect x="48" y="58" width="8" height="32" rx="3" fill="#4ade80" />
    <rect x="60" y="46" width="8" height="44" rx="3" fill="#fef08a" />
    <rect x="72" y="36" width="8" height="54" rx="3" fill="#ffffff" />
    <!-- Growth Arrow -->
    <path d="M 38 66 L 52 52 L 64 42 L 80 30" stroke="#fef08a" stroke-width="4" stroke-linecap="round" fill="none" />
    <polygon points="76,26 86,28 84,38" fill="#fef08a" />
  </g>
</svg>
